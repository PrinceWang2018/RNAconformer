# Build the RCV installers on GitHub's machines: Windows (x64 setup), macOS (Apple Silicon and Intel disk
# images) and Linux (.deb and .rpm, x86_64). macOS installers cannot be built on Windows, so this is the way to
# make them without a Mac. The Linux packages are built on Debian 11 (old glibc: they run on Ubuntu 20.04+,
# Debian 11+, Fedora, RHEL/Rocky/Alma 9+) and test-installed on several distributions.
#
#   Run it by hand:  Actions > Build installers > Run workflow      (installers appear as a download on the run)
#   Or push a tag:   git tag v0.6.0 && git push origin v0.6.0
#
# For a tag, the installers are also attached to a release of the website repository (where the download
# links of www.rnaconfviewer.com point) when the secret WEBSITE_RELEASE_TOKEN is set: a fine-grained token with
# "Contents: read and write" permission on PrinceWang2018/RNAconfViewer_website.
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy ViennaRNA==2.7.2 fonttools pillow
      - run: python -m unittest discover -s tests
        env:
          PYTHONPATH: src

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-15            # Apple Silicon (arm64)
            name: macos-arm64
          - os: macos-15-intel      # Intel (x86_64)
            name: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          powershell -ExecutionPolicy Bypass -File packaging\build_windows.ps1 -Python python

      - name: macOS disk image
        if: runner.os == 'macOS'
        run: PYTHON=python bash packaging/macos/build_macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: RCV-${{ matrix.name }}
          path: dist/installer/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    container: python:3.12-bullseye
    steps:
      - uses: actions/checkout@v4
      - name: rpmbuild
        # Debian 11 is past its end of life and its security archive no longer has every file it lists; a
        # packaging tool does not need it, so rpm comes from the main archive.
        run: |
          sed -i '/security/d' /etc/apt/sources.list
          rm -f /etc/apt/sources.list.d/*security*
          apt-get update && apt-get install -y --no-install-recommends rpm
      - name: Linux packages
        run: PYTHON=python3 bash packaging/linux/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: RCV-linux-x86_64
          path: dist/installer/*
          if-no-files-found: error

  linux-install-test:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:20.04', 'ubuntu:24.04', 'debian:12', 'fedora:latest', 'almalinux:9', 'opensuse/leap:15.6']
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RCV-linux-x86_64
          path: pkgs
      - name: Install
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y ./pkgs/*.deb
          elif command -v zypper >/dev/null; then
            zypper --non-interactive install --allow-unsigned-rpm ./pkgs/*.rpm
          else
            dnf install -y ./pkgs/*.rpm
          fi
      - name: Run
        run: |
          rcv --version
          rcv engine ss --sequence GGCACUUCGGUGCC
          rcv convert /opt/rcv/_internal/rcv/demo/HIV1_TAR_NMR_1ANR.pdb -o /tmp/t.rcv
          rcv info /tmp/t.rcv
          test -f /usr/share/applications/rcv.desktop && test -f /opt/rcv/docs/index.html
      - name: Uninstall
        run: |
          if command -v apt-get >/dev/null; then apt-get remove -y rcv
          elif command -v zypper >/dev/null; then zypper --non-interactive remove rcv
          else dnf remove -y rcv; fi
          test ! -e /opt/rcv && test ! -e /usr/bin/rcv

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, linux, linux-install-test]
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.WEBSITE_RELEASE_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - run: ls -la installers
      - name: Attach to the website release
        if: env.TOKEN != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: PrinceWang2018/RNAconfViewer_website
          token: ${{ env.TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: RCV ${{ github.ref_name }}
          files: installers/*
